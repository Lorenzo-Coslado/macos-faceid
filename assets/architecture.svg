<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">How Mugshot works</title>
  <desc id="description">The PAM module asks the user's recognition engine to match camera frames with enrolled faces. The engine animates the Fusion HUD and returns the match result to PAM. Optional lock-screen unlock checks permissions and session state, then sends the saved Keychain password to the genuine macOS loginwindow process.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#697871"/>
    </marker>
    <marker id="result" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#347b4a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="538" rx="20" fill="#fafcfb" stroke="#dce5df"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#20352a">
    <text x="32" y="40" text-anchor="start" font-size="14" font-weight="700" letter-spacing="1.3">ON YOUR MAC</text>

    <g fill="none" stroke="#697871" stroke-width="2" marker-end="url(#arrow)">
      <path d="M182 201H232"/>
      <path d="M402 201H462"/>
      <path d="M520 119V143"/>
      <path d="M704 119V131H640V143"/>
      <path d="M698 201H786"/>
      <path d="M580 255V368"/>
      <path d="M402 413H462"/>
      <path d="M698 413H786"/>
    </g>
    <path d="M504 255V295H317V235" fill="none" stroke="#347b4a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#result)"/>
    <text x="432" y="188" font-size="11" fill="#58665e">request</text>
    <text x="412" y="319" font-size="13" fill="#347b4a">Match result → allow sudo or use password</text>
    <text x="592" y="349" text-anchor="start" font-size="12" fill="#58665e">face recognized</text>

    <g stroke="#d2ddd5" fill="#fff">
      <rect x="32" y="168" width="150" height="66" rx="12"/>
      <rect x="232" y="168" width="170" height="66" rx="12"/>
      <rect x="440" y="63" width="160" height="56" rx="12"/>
      <rect x="624" y="63" width="170" height="56" rx="12"/>
      <rect x="786" y="168" width="180" height="66" rx="12"/>
      <rect x="232" y="380" width="170" height="66" rx="12"/>
      <rect x="786" y="380" width="180" height="66" rx="12"/>
    </g>
    <g fill="#eaf5ec" stroke="#8dbf99">
      <rect x="462" y="145" width="236" height="110" rx="14"/>
      <rect x="462" y="370" width="236" height="86" rx="14"/>
    </g>

    <g font-size="17" font-weight="600">
      <text x="107" y="208" font-family="Menlo, monospace">sudo</text>
      <text x="317" y="195">PAM module</text>
      <text x="520" y="98">Camera</text>
      <text x="709" y="98">Enrolled faces</text>
      <text x="580" y="180">Recognition engine</text>
      <text x="876" y="195">Fusion HUD</text>
      <text x="317" y="407">Mac Keychain</text>
      <text x="580" y="397">Lock-screen unlock</text>
      <text x="876" y="407">Keyboard events</text>
    </g>
    <g font-size="13" fill="#58665e">
      <text x="317" y="216">runs as root</text>
      <text x="580" y="205">YuNet + SFace</text>
      <text x="580" y="230">Mugshot's user session</text>
      <text x="876" y="216">scan and match animation</text>
      <text x="317" y="428">saved login password</text>
      <text x="580" y="420">optional · checks permissions</text>
      <text x="580" y="439">and locked-session state</text>
      <text x="876" y="428">genuine macOS loginwindow</text>
    </g>
    <text x="500" y="505" font-size="13" fill="#58665e">Camera frames and face data stay on your Mac. FileVault and the first login still require your password.</text>
  </g>
</svg>
