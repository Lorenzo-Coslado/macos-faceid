name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MUGSHOT_SWIFT_TARGET: arm64-apple-macosx14.0

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip wheel
          ./.venv/bin/pip install -r requirements.txt

      - name: Download models
        run: bash scripts/download-models.sh

      - name: Generate assets (icons + translations)
        run: |
          ./.venv/bin/python scripts/make_icon.py
          ./.venv/bin/python scripts/make_appicon.py
          ./.venv/bin/python scripts/make_i18n.py

      - name: Recognition self-test
        run: ./.venv/bin/python -m faceid.selftest

      - name: Build native helpers
        run: bash scripts/build-helpers.sh

      - name: Build PAM module
        run: make -C pam

      - name: Fetch Sparkle
        run: bash scripts/fetch-sparkle.sh

      - name: Compile menu bar app
        run: |
          swiftc -O -swift-version 5 -target "$MUGSHOT_SWIFT_TARGET" -o /tmp/Mugshot \
            menubar/Branding.swift menubar/Onboarding.swift \
            menubar/SettingsView.swift menubar/HelperManager.swift \
            helpertool/HelperProtocol.swift menubar/FaceIDApp.swift \
            -framework AppKit -framework SwiftUI \
            -framework AVFoundation -framework ServiceManagement -framework Security \
            -F vendor/sparkle -framework Sparkle \
            -Xlinker -rpath -Xlinker @executable_path/../Frameworks

      - name: Compile privileged helper
        run: |
          swiftc -O -swift-version 5 -target "$MUGSHOT_SWIFT_TARGET" -o /tmp/MugshotHelper \
            helpertool/main.swift helpertool/HelperProtocol.swift \
            helpertool/CodesignCheck.swift \
            -framework Foundation -framework Security

  bundle:
    # Assemble the shippable bundle on the oldest supported macOS and actually run the
    # frozen engine there. This is what catches a build that silently inherits a newer
    # deployment target: 1.0.1 shipped requiring macOS 26 while advertising 13.0.
    name: Bundle runs on the oldest supported macOS
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip wheel
          ./.venv/bin/pip install -r requirements.txt

      - name: Download models
        run: bash scripts/download-models.sh

      - name: Build the standalone bundle
        run: bash scripts/build-standalone.sh

      - name: Run the frozen engine from the bundle
        run: |
          RES="dist/Mugshot.app/Contents/Resources"
          FACEID_MODELS_DIR="$PWD/$RES/models" \
          FACEID_ASSETS_DIR="$PWD/$RES/assets" \
          FACEID_HELPERS_DIR="$PWD/$RES/helpers" \
          "$RES/faceid/faceid" selftest

      - name: Check the advertised minimum matches the binaries
        run: |
          PLIST_MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" \
            dist/Mugshot.app/Contents/Info.plist)
          echo "Info.plist advertises macOS $PLIST_MIN"
          bash scripts/check-macos-compat.sh dist/Mugshot.app

      - name: PAM module loads
        run: bash scripts/check-pam-module.sh dist/Mugshot.app/Contents/Resources/pam/pam_faceid.so

      - name: sudo still works with the module installed
        run: |
          # Install exactly like the privileged helper does, then prove sudo loads the
          # module without breaking authentication. The rule is `sufficient`, so a failed
          # face check must fall through to the next method rather than lock sudo up.
          sudo mkdir -p /usr/local/lib/pam
          sudo cp dist/Mugshot.app/Contents/Resources/pam/pam_faceid.so /usr/local/lib/pam/
          printf 'auth       sufficient     /usr/local/lib/pam/pam_faceid.so\n' \
            | sudo tee /etc/pam.d/sudo_local >/dev/null
          sudo -k
          timeout 60 sudo -n true
          echo "sudo authenticated with the module loaded (fell through as expected)"
          sudo rm -f /etc/pam.d/sudo_local /usr/local/lib/pam/pam_faceid.so
